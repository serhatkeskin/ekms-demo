services:
  web:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - media_data:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_demo_data &&
             daphne -b 0.0.0.0 -p 8000 core.asgi:application"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ekms_demo
      POSTGRES_USER: ekms
      POSTGRES_PASSWORD: ekms_local
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekms -d ekms_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data:
  media_data:
